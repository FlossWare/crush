[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-consensus"
version = "0.1.0"
description = "MCP server for multi-model AI consensus (arbiter/worker pattern)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-consensus = "mcp_consensus.server:entry"

[tool.setuptools.packages.find]
include = ["mcp_consensus*"]
